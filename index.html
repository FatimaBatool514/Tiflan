<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiflan | طفلان</title>
<meta name="theme-color" content="#2B1B5E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Tiflan | طفلان – early learning screening for children aged 4–8, in Arabic and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Readex+Pro:wght@300;400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<noscript><p style="padding:24px;color:#fff">Tiflan needs JavaScript. | طفلان يحتاج تفعيل جافاسكربت.</p></noscript>
<main class="stage" id="stage">

  <header class="nav">
    <a class="brand" href="#" aria-label="Tiflan طفلان">
      <img class="logo" src="assets/logo.webp" alt="" width="44" height="44" decoding="async">
      <span class="brand-en">Tiflan</span><span class="brand-ar">طفلان</span>
    </a>
    <nav class="links">
      <a href="#" class="on" data-i18n="nav1"></a>
      <a href="#" data-open="agents" data-i18n="nav2"></a>
      <a href="#" data-open="privacy" data-i18n="nav3"></a>
    </nav>
    <div class="nav-end">
      <button class="lang" id="langBtn" type="button" aria-label="Switch language"></button>
      <button class="pill pill-sm" type="button" data-start data-i18n="cta"></button>
    </div>
  </header>


  <section class="copy">
    <span class="badge"><i></i><span data-i18n="badge"></span></span>
    <h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em></h1>
    <p data-i18n="sub"></p>
    <button class="pill" type="button" data-start><span data-i18n="cta2"></span><b>↗</b></button>
    <button class="ghost" type="button" id="wanderBtn">↻ <span data-i18n="wander"></span></button>
    <small class="note" data-i18n="note"></small>
    <div class="mini"><button class="ghost" type="button" data-open="demo">▶ <span data-i18n="m_demo"></span></button><button class="ghost" type="button" data-open="agents">🧩 <span data-i18n="m_agents"></span></button><button class="ghost" type="button" data-open="privacy">🛡️ <span data-i18n="m_priv"></span></button></div>
  </section>

  <section class="falcon-wrap" aria-label="Baby mascots">
    <div id="babies" class="babies">
      <div class="baby" data-g="boy"><div class="wrap"><img data-d="down" src="assets/boy-down.webp" alt="Boy mascot" decoding="async" draggable="false"><img data-d="up" src="assets/boy-up.webp" alt="" decoding="async" draggable="false"><img data-d="left" src="assets/boy-left.webp" alt="" decoding="async" draggable="false"><img data-d="right" src="assets/boy-right.webp" alt="" decoding="async" draggable="false"></div></div>
      <div class="baby" data-g="girl"><div class="wrap"><img data-d="down" src="assets/girl-down.webp" alt="Girl mascot" decoding="async" draggable="false"><img data-d="up" src="assets/girl-up.webp" alt="" decoding="async" draggable="false"><img data-d="left" src="assets/girl-left.webp" alt="" decoding="async" draggable="false"><img data-d="right" src="assets/girl-right.webp" alt="" decoding="async" draggable="false"></div></div>
    </div>
  </section>

  <aside class="card live" aria-live="polite">
    <div class="live-top"><span><i class="dot"></i><span data-i18n="live"></span></span><b>SESSION</b></div>
    <div class="live-body">
      <div class="dial" id="dial"><span class="u">↑</span><span class="d">↓</span><span class="l">←</span><span class="r">→</span><i id="dialDot"></i></div>
      <div class="rd"><small data-i18n="looking"></small><strong id="dirTxt">—</strong></div>
    </div>
    <div class="live-bot">
      <div class="rd"><small data-i18n="engage"></small><strong id="moodTxt">—</strong></div>
      <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
    </div>
  </aside>

  <aside class="card next" id="games">
    <div class="thumb">⭐</div>
    <div class="nx"><span class="tag" data-i18n="nextTag"></span><b data-i18n="nextTitle"></b><small data-i18n="nextSub"></small></div>
  </aside>

  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
  <div class="sheet-card">
    <button class="x" id="shClose" type="button" aria-label="Close">✕</button>
    <div class="guard"><i></i><span data-i18n="guard"></span></div>
    <div class="prog" id="prog"><i></i><i></i><i></i><i></i></div>

    <div class="pane" data-pane="0">
      <h2 data-i18n="c_title"></h2><p class="sub" data-i18n="c_sub"></p>
      <ul class="promises"><li data-i18n="p1"></li><li data-i18n="p2"></li><li data-i18n="p3"></li><li data-i18n="p4"></li></ul>
      <label class="chk"><input type="checkbox" id="cPlay"><span data-i18n="c_play"></span></label>
      <label class="chk"><input type="checkbox" id="cMic"><span data-i18n="c_mic"></span></label>
      <label class="chk optional"><input type="checkbox" id="cCam"><span data-i18n="c_cam"></span></label>
    </div>

    <div class="pane" data-pane="1" hidden>
      <h2 data-i18n="a_title"></h2><p class="sub" data-i18n="a_sub"></p>
      <div class="chips ages">
        <button type="button" class="chip" data-age="4">4</button><button type="button" class="chip" data-age="5">5</button>
        <button type="button" class="chip" data-age="6">6</button><button type="button" class="chip" data-age="7">7</button>
        <button type="button" class="chip" data-age="8">8</button>
      </div>
      <p class="sub" data-i18n="yrs"></p>
    </div>

    <div class="pane" data-pane="2" hidden>
      <h2 data-i18n="g_title"></h2>
      <h3 data-i18n="gender_q"></h3>
      <div class="chips"><button type="button" class="chip gchip" data-gender="girl"><img src="assets/girl-face.webp" alt=""><span data-i18n="g_girl"></span></button><button type="button" class="chip gchip" data-gender="boy"><img src="assets/boy-face.webp" alt=""><span data-i18n="g_boy"></span></button></div>
      <h3 data-i18n="hl_q"></h3>
      <div class="chips"><button type="button" class="chip" data-hl="ar" data-i18n="hl_ar"></button><button type="button" class="chip" data-hl="en" data-i18n="hl_en"></button><button type="button" class="chip" data-hl="both" data-i18n="hl_both"></button></div>
      <h3 data-i18n="dialect_q"></h3>
      <div class="chips"><button type="button" class="chip" data-dialect="gulf" data-i18n="d_gulf"></button><button type="button" class="chip" data-dialect="egy" data-i18n="d_egy"></button><button type="button" class="chip" data-dialect="lev" data-i18n="d_lev"></button><button type="button" class="chip" data-dialect="mag" data-i18n="d_mag"></button><button type="button" class="chip" data-dialect="msa" data-i18n="d_msa"></button><button type="button" class="chip" data-dialect="en" data-i18n="d_en"></button></div>
    </div>

    <div class="pane" data-pane="3" hidden>
      <h2 data-i18n="s_title"></h2>
      <ul class="promises sum" id="sumBox"></ul>
      <button type="button" class="ghost danger" id="wipe">🗑 <span data-i18n="del"></span></button>
    </div>

    <div class="foot">
      <button type="button" class="ghost" id="back" hidden data-i18n="back"></button>
      <button type="button" class="pill" id="next" disabled><span></span><b>↗</b></button>
    </div>
  </div>
</div>
<div class="sheet" id="intake" hidden role="dialog" aria-modal="true">
  <div class="sheet-card wide">
    <button class="x" id="inClose" type="button" aria-label="Close">✕</button>
    <div class="agent-head">
      <img class="avatar" id="avatar" alt="" src="assets/girl-face.webp">
      <div class="ah"><b data-i18n="in_agent"></b><small id="inStatus"></small></div>
      <button class="tog" id="vToggle" type="button" aria-label="Voice">🔊</button>
    </div>
    <div class="prog" id="inProg"></div>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="chips" id="qChips"></div>
    <div class="inrow" id="inRow">
      <button class="mic" id="mic" type="button" aria-label="Microphone">🎤</button>
      <input id="inText" type="text" autocomplete="off">
      <button class="send" id="send" type="button">➤</button>
    </div>
    <div id="inFin" hidden>
      <ul class="promises sum" id="inSum"></ul>
      <p class="flagline" id="inFlags"></p><p class="sub" data-i18n="in_note"></p>
      <div class="foot"><button type="button" class="ghost" id="inRedo" data-i18n="in_redo"></button><button type="button" class="ghost" id="inRes" hidden data-i18n="in_res"></button>
      <button type="button" class="pill" id="inCont"><span data-i18n="in_cont"></span><b>↗</b></button></div>
    </div>
    <small class="priv" id="aiBadge"></small><small class="priv" data-i18n="in_stt"></small>
  </div>
</div>
<div class="sheet" id="game" hidden role="dialog" aria-modal="true">
  <div class="sheet-card wide game-card">
    <button class="x" id="gmClose" type="button" aria-label="Close">✕</button>
    <div class="gm-head"><b id="gmTitle"></b><small id="gmCount"></small></div>
    <div class="prog" id="gmProg"></div>
    <div class="gm-body" id="gmBody"></div>
  </div>
</div>
<div class="sheet" id="results" hidden role="dialog" aria-modal="true">
  <div class="sheet-card wide res-card">
    <button class="x" id="rsClose" type="button" aria-label="Close">✕</button>
    <div class="guard proto" id="rsProto"></div>
    <div id="rsBody"></div>
  </div>
</div>
<div class="sheet" id="support" hidden role="dialog" aria-modal="true">
  <div class="sheet-card wide res-card">
    <button class="x" id="spClose" type="button" aria-label="Close">✕</button>
    <div class="tabs" id="spTabs"></div>
    <div id="spBody"></div>
  </div>
</div>
<div class="sheet" id="agentsSheet" hidden role="dialog" aria-modal="true"><div class="sheet-card wide res-card"><button class="x" id="agClose" type="button" aria-label="Close">✕</button><div id="agBody" class="stack"></div></div></div>
<div class="sheet" id="privSheet" hidden role="dialog" aria-modal="true"><div class="sheet-card wide res-card"><button class="x" id="prClose" type="button" aria-label="Close">✕</button><div id="prBody" class="stack"></div></div></div>
<div class="toast" id="toast" role="status"></div>
  
</main>
<div id="printArea"></div>
<script src="js/i18n.js"></script>
<script src="js/i18n-onboard.js"></script>
<script src="js/config.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/intake.js"></script>
<script src="js/games.js"></script>
<script src="js/risk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/centers.js"></script>
<script src="js/support.js"></script>
<script src="js/polish.js"></script>
<script src="js/app.js"></script>
</body>
</html>
