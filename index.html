<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiflan | طفلان</title>
<meta name="theme-color" content="#2B1B5E">
<meta name="description" content="Tiflan | طفلان – early learning screening for children aged 4–8, in Arabic and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Readex+Pro:wght@300;400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="stage" id="stage">

  <header class="nav">
    <a class="brand" href="#" aria-label="Tiflan طفلان">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#FFC94D"/><path d="M8 20c2-8 9-11 17-9-3 1-5 3-6 5 2 0 4 1 5 3-4-1-7 0-9 3-2-1-5-2-7-2z" fill="#2B1B5E"/></svg>
      <span class="brand-en">Tiflan</span><span class="brand-ar">طفلان</span>
    </a>
    <nav class="links">
      <a href="#" class="on" data-i18n="nav1"></a>
      <a href="#games" data-i18n="nav2"></a>
      <a href="#privacy" data-i18n="nav3"></a>
    </nav>
    <div class="nav-end">
      <button class="lang" id="langBtn" type="button" aria-label="Switch language"></button>
      <button class="pill pill-sm" type="button" data-start data-i18n="cta"></button>
    </div>
  </header>

  <div class="side" aria-hidden="true"><span data-i18n="side"></span></div>

  <section class="copy">
    <span class="badge"><i></i><span data-i18n="badge"></span></span>
    <h1><span data-i18n="h1a"></span> <em data-i18n="h1b"></em></h1>
    <p data-i18n="sub"></p>
    <button class="pill" type="button" data-start><span data-i18n="cta2"></span><b>↗</b></button>
    <button class="ghost" type="button" id="wanderBtn">↻ <span data-i18n="wander"></span></button>
    <small class="note" data-i18n="note"></small>
  </section>

  <section class="falcon-wrap" aria-label="Falcon mascot">
    <div class="shadow"></div>
    <svg id="falcon" viewBox="0 0 400 470" role="img" aria-label="Baby falcon">
      <g id="bob">
        <path d="M120 330c-40 10-60 50-50 95 30-10 60-30 80-70z" fill="#C98D4B"/>
        <path d="M280 330c40 10 60 50 50 95-30-10-60-30-80-70z" fill="#C98D4B"/>
        <ellipse cx="200" cy="335" rx="108" ry="112" fill="#E9B872"/>
        <ellipse cx="200" cy="360" rx="68" ry="80" fill="#FFF1D6"/>
        <g fill="#C98D4B" opacity=".55"><circle cx="180" cy="340" r="5"/><circle cx="215" cy="335" r="5"/><circle cx="200" cy="365" r="5"/><circle cx="172" cy="378" r="4"/><circle cx="228" cy="376" r="4"/></g>
        <ellipse cx="160" cy="448" rx="26" ry="11" fill="#FFC94D"/><ellipse cx="240" cy="448" rx="26" ry="11" fill="#FFC94D"/>
        <g id="head">
          <path d="M175 92c-6-24 6-40 14-46 2 12 8 20 11 22 3-2 9-10 11-22 8 6 20 22 14 46z" fill="#C98D4B"/>
          <circle cx="200" cy="190" r="108" fill="#E9B872"/>
          <ellipse cx="200" cy="205" rx="86" ry="72" fill="#FFF1D6"/>
          <circle cx="132" cy="222" r="15" fill="#FF8A6B" opacity=".45"/><circle cx="268" cy="222" r="15" fill="#FF8A6B" opacity=".45"/>
          <path d="M148 204c-6 14-4 30 6 40-1-14 2-26 8-34zM252 204c6 14 4 30-6 40 1-14-2-26-8-34z" fill="#6B4423"/>
          <g class="eye" id="eyeL"><circle cx="158" cy="186" r="30" fill="#fff"/><g class="pupil"><circle cx="158" cy="186" r="16" fill="#2B1B5E"/><circle cx="153" cy="180" r="5" fill="#fff"/></g></g>
          <g class="eye" id="eyeR"><circle cx="242" cy="186" r="30" fill="#fff"/><g class="pupil"><circle cx="242" cy="186" r="16" fill="#2B1B5E"/><circle cx="237" cy="180" r="5" fill="#fff"/></g></g>
          <path d="M176 218c0-8 48-8 48 0 0 14-10 30-24 38-14-8-24-24-24-38z" fill="#FFC94D"/>
          <path d="M192 226c4 3 12 3 16 0" stroke="#C98D4B" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </section>

  <aside class="card live" aria-live="polite">
    <div class="live-top"><span><i class="dot"></i><span data-i18n="live"></span></span><b>SESSION</b></div>
    <div class="live-body">
      <div class="dial" id="dial"><span class="u">↑</span><span class="d">↓</span><span class="l">←</span><span class="r">→</span><i id="dialDot"></i></div>
      <div class="rd"><small data-i18n="looking"></small><strong id="dirTxt">—</strong></div>
    </div>
    <div class="live-bot">
      <div class="rd"><small data-i18n="engage"></small><strong id="moodTxt">—</strong></div>
      <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
    </div>
  </aside>

  <aside class="card next" id="games">
    <div class="thumb">⭐</div>
    <div class="nx"><span class="tag" data-i18n="nextTag"></span><b data-i18n="nextTitle"></b><small data-i18n="nextSub"></small></div>
  </aside>

  <div class="toast" id="toast" role="status"></div>
  <span id="privacy"></span>
</main>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
