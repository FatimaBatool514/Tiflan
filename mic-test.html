<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiflan microphone test</title>
<style>body{font-family:system-ui,sans-serif;background:#2B1B5E;color:#FFF8EC;padding:16px;max-width:640px;margin:auto;line-height:1.6}button,select{min-height:48px;padding:0 18px;border-radius:14px;border:0;font:inherit;margin:4px 0}button{background:#FFC94D;color:#2B1B5E;font-weight:600}pre{background:#0005;padding:12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:.85rem}#meter{height:14px;background:#ffffff33;border-radius:7px;overflow:hidden}#bar{height:100%;width:0;background:#4FD1A5}</style></head><body>
<h1>Tiflan microphone test</h1><p>Open this page on the same address as the app, then run the three tests and send me what the boxes say.</p><pre id="env"></pre>
<h2>1. Microphone permission</h2><button id="b1">Test microphone (speak for 5 seconds)</button><div id="meter"><div id="bar"></div></div><pre id="o1">not run</pre>
<h2>2. Speech recognition</h2><select id="lang"><option>ar-AE</option><option>ar-SA</option><option>ar-EG</option><option>en-US</option></select><button id="b2">Start listening, then say a word</button><pre id="o2">not run</pre>
<h2>3. Speaker voices</h2><button id="b3">Speak Arabic, then English</button><pre id="o3">not run</pre>
<script>
const $=s=>document.querySelector(s),log=(id,t)=>{$(id).textContent+=(($(id).textContent==="not run")?"":"\n")+t};$("#o1").textContent=$("#o2").textContent=$("#o3").textContent="not run";
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("#env").textContent=["address: "+location.origin,"secure context (https): "+isSecureContext,"page inside a frame: "+(top!==self),"speech recognition available: "+!!SR,"speech synthesis available: "+!!window.speechSynthesis,"browser: "+navigator.userAgent].join("\n");
if(navigator.permissions&&navigator.permissions.query)navigator.permissions.query({name:"microphone"}).then(p=>{$("#env").textContent+="\nmicrophone permission for this site: "+p.state}).catch(()=>{});
$("#b1").onclick=async()=>{$("#o1").textContent="";try{const st=await navigator.mediaDevices.getUserMedia({audio:true});log("#o1","OK: microphone opened ("+(st.getAudioTracks()[0].label||"no label")+"). Speak now, the bar should move.");
 const ac=new(window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();ac.createMediaStreamSource(st).connect(an);const b=new Uint8Array(an.fftSize);let peak=0;const t0=Date.now();
 const iv=setInterval(()=>{an.getByteTimeDomainData(b);let s=0;for(const v of b){const x=(v-128)/128;s+=x*x}const l=Math.sqrt(s/b.length);peak=Math.max(peak,l);$("#bar").style.width=Math.min(100,l*400)+"%";
  if(Date.now()-t0>5000){clearInterval(iv);st.getTracks().forEach(t=>t.stop());ac.close();$("#bar").style.width="0";log("#o1",peak>0.03?"RESULT: sound detected. The microphone works.":"RESULT: opened but almost no sound. Check the volume, the mute switch, or which microphone is selected.")}},60)}
 catch(e){log("#o1","FAILED: "+e.name+" - "+e.message+"\n"+({NotAllowedError:"Permission is blocked. Tap the lock icon next to the address, set Microphone to Allow, and reload.",NotFoundError:"No microphone found.",NotReadableError:"Another app is using the microphone.",SecurityError:"Blocked by the page's security policy."}[e.name]||""))}};
$("#b2").onclick=()=>{$("#o2").textContent="";if(!SR)return log("#o2","FAILED: this browser has no speech recognition. Use Chrome.");const r=new SR();r.lang=$("#lang").value;r.interimResults=true;r.continuous=true;
 ["start","audiostart","soundstart","speechstart","speechend","audioend","end"].forEach(n=>r["on"+n]=()=>log("#o2","event: "+n));r.onerror=e=>log("#o2","ERROR: "+e.error+" "+(e.message||"")+" "+({"not-allowed":"(microphone or speech permission blocked)","service-not-allowed":"(the browser blocks speech recognition here)","network":"(no internet or the speech service is unreachable)","language-not-supported":"(try another language in the list)","no-speech":"(nothing was heard)","audio-capture":"(no microphone available)"}[e.error]||""));
 r.onresult=e=>log("#o2","HEARD: "+[...e.results].map(x=>x[0].transcript).join(" "));try{r.start();setTimeout(()=>{try{r.stop()}catch(e){}},9000)}catch(e){log("#o2","FAILED to start: "+e.message)}};
$("#b3").onclick=()=>{$("#o3").textContent="";const ss=window.speechSynthesis;if(!ss)return log("#o3","FAILED: no speech synthesis");const vs=ss.getVoices();log("#o3","voices: "+vs.length+" | Arabic: "+(vs.filter(v=>v.lang.startsWith("ar")).map(v=>v.name+" ("+v.lang+")").join(", ")||"none"));
 const say=(t,l)=>{const u=new SpeechSynthesisUtterance(t);u.lang=l;u.onstart=()=>log("#o3","speaking "+l);u.onend=()=>log("#o3","done "+l);u.onerror=e=>log("#o3","ERROR "+l+": "+e.error);ss.speak(u)};say("مرحبا، أنا طفلان","ar-AE");say("Hello, I am Tiflan","en-US")};
</script></body></html>
